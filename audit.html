<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNRLVL ShopifyAuditor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0A0A0A;--sf:#141414;--sf2:#1E1E1E;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);--tx:#F2F0EC;--mu:rgba(242,240,236,.45);--di:rgba(242,240,236,.22);--cy:#00FFD1;--re:#FF4444;--am:#FFB020;--bl:#4499FF;--fn:'Courier New',monospace}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);min-height:100vh;font-size:13px}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
.topbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;flex-direction:column;gap:8px}
.topbar-row1{display:flex;align-items:center;gap:12px}
.logo{color:var(--cy);font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap}
.store-status{font-size:10px;color:var(--mu);padding:3px 10px;background:var(--sf2);border:1px solid var(--bd);letter-spacing:.08em}
.topbar-row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.domain-label{font-size:10px;color:var(--mu);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.domain-input{background:var(--sf2);border:1px solid var(--bd2);color:var(--tx);padding:6px 12px;font-family:var(--fn);font-size:12px;outline:none;flex:1;min-width:200px;max-width:380px}
.domain-input:focus{border-color:var(--cy)}
.domain-input::placeholder{color:var(--di)}
.btn{font-family:var(--fn);cursor:pointer;border:none;padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.btn-p{background:var(--cy);color:#080808}.btn-p:hover{opacity:.85}.btn-p:disabled{background:var(--sf2);color:var(--di);cursor:not-allowed}
.btn-g{background:transparent;color:var(--mu);border:1px solid var(--bd2)}.btn-g:hover{color:var(--tx)}
.btn-fix{background:rgba(0,255,209,.1);color:var(--cy);border:1px solid rgba(0,255,209,.3);padding:4px 10px;font-family:var(--fn);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.btn-fix:hover{background:rgba(0,255,209,.2)}
.btn-ht{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:4px 10px;font-family:var(--fn);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.btn-ht:hover{color:var(--tx);border-color:var(--bd2)}
.score-badge{font-size:18px;font-weight:700;padding:2px 10px;border:1px solid}
.sc-g{color:var(--cy);border-color:rgba(0,255,209,.3);background:rgba(0,255,209,.06)}
.sc-a{color:var(--am);border-color:rgba(255,176,32,.3);background:rgba(255,176,32,.06)}
.sc-r{color:var(--re);border-color:rgba(255,68,68,.3);background:rgba(255,68,68,.06)}
.conn-error{font-size:10px;color:var(--re);padding:2px 8px;background:rgba(255,68,68,.08);border:1px solid rgba(255,68,68,.2)}
.conn-ok{font-size:10px;color:var(--cy);padding:2px 8px;background:rgba(0,255,209,.06);border:1px solid rgba(0,255,209,.2)}
.main{display:grid;grid-template-columns:200px 1fr;overflow:hidden}
.sidebar{border-right:1px solid var(--bd);overflow-y:auto;padding:8px 0}
.sid-hd{padding:8px 14px 4px;font-size:9px;letter-spacing:.2em;color:var(--di);text-transform:uppercase}
.mod-row{display:flex;align-items:center;gap:6px;padding:6px 14px;cursor:pointer;border-left:2px solid transparent}
.mod-row:hover{background:var(--sf)}.mod-row.act{background:var(--sf);border-left-color:var(--cy)}
.mod-nm{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);flex:1}
.mod-row.act .mod-nm{color:var(--tx)}
.mod-sc{font-size:11px;font-weight:700}
.badge{font-size:8px;padding:1px 5px;border-radius:2px;font-weight:700}
.bd-c{background:rgba(255,68,68,.15);color:var(--re)}
.bd-i{background:rgba(255,176,32,.1);color:var(--am)}
.bd-f{background:rgba(0,255,209,.12);color:var(--cy);border:1px solid rgba(0,255,209,.25)}
.content{overflow-y:auto;padding:20px}
.ov-grid{display:grid;grid-template-columns:auto 1fr;gap:16px;margin-bottom:20px}
.score-box{background:var(--sf);border:1px solid rgba(0,255,209,.25);padding:16px 24px;text-align:center}
.score-num{font-size:56px;font-weight:900;line-height:1}
.score-lbl{font-size:9px;letter-spacing:.2em;color:var(--mu);margin-top:4px;text-transform:uppercase}
.cnt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.cnt{background:var(--sf);border:1px solid var(--bd);padding:10px 14px;text-align:center}
.cnt-n{font-size:26px;font-weight:700;line-height:1;margin-bottom:2px}
.cnt-l{font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.cnt.cr{border-color:rgba(255,68,68,.2);background:rgba(255,68,68,.04)}.cnt.cr .cnt-n,.cnt.cr .cnt-l{color:var(--re)}
.cnt.im{border-color:rgba(255,176,32,.15);background:rgba(255,176,32,.03)}.cnt.im .cnt-n,.cnt.im .cnt-l{color:var(--am)}
.cnt.op{border-color:rgba(68,153,255,.15);background:rgba(68,153,255,.03)}.cnt.op .cnt-n,.cnt.op .cnt-l{color:var(--bl)}
.cnt.fx{border-color:rgba(0,255,209,.18);background:rgba(0,255,209,.03)}.cnt.fx .cnt-n,.cnt.fx .cnt-l{color:var(--cy)}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px;margin-bottom:20px}
.mod-tile{background:var(--sf);border:1px solid var(--bd);padding:6px 9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.mod-tile:hover{border-color:var(--bd2)}
.tile-nm{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--mu)}
.tile-sc{font-size:11px;font-weight:700}
.sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--bd);margin-top:16px}
.sec-hd:first-child{margin-top:0}
.sec-ttl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}
.fc{background:var(--sf);border:1px solid var(--bd);margin-bottom:6px;overflow:hidden}
.fc.cr{border-left:3px solid var(--re)}.fc.im{border-left:3px solid var(--am)}.fc.op{border-left:3px solid var(--bl)}.fc.ok{border-left:3px solid rgba(0,255,209,.25);opacity:.6}
.fh{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.sev{font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap;flex-shrink:0}
.sev.cr{background:rgba(255,68,68,.15);color:var(--re)}.sev.im{background:rgba(255,176,32,.1);color:var(--am)}.sev.op{background:rgba(68,153,255,.1);color:var(--bl)}.sev.ok{background:rgba(0,255,209,.06);color:rgba(0,255,209,.55)}
.fcode{font-size:10px;color:var(--di);white-space:nowrap;flex-shrink:0}
.ftitle{font-size:12px;font-weight:700;flex:1;min-width:0}
.fcnt{font-size:10px;color:var(--di);white-space:nowrap}
.ftog{color:var(--di);font-size:13px;flex-shrink:0;transition:transform .18s}.ftog.open{transform:rotate(90deg)}
.fb{border-top:1px solid var(--bd);padding:12px 14px;display:none}.fb.open{display:block}
.fdetail{font-size:11px;color:var(--mu);line-height:1.65;margin-bottom:10px}
.res-hd{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--di);margin-bottom:5px}
.res-list{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:10px;max-height:100px;overflow-y:auto}
.chip{background:var(--sf2);border:1px solid var(--bd);padding:2px 7px;font-size:10px;color:var(--mu)}
.chip .cv{color:var(--di);font-size:9px;margin-left:3px}
.factions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fstatus{font-size:10px;padding:3px 9px;border-radius:2px}
.fstatus.applying{background:rgba(255,176,32,.1);color:var(--am)}.fstatus.done{background:rgba(0,255,209,.1);color:var(--cy)}.fstatus.error{background:rgba(255,68,68,.1);color:var(--re)}
.ht-box{background:var(--sf2);border:1px solid var(--bd);padding:10px 12px;margin-top:8px;display:none}.ht-box.open{display:block}
.ht-ttl{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--cy);margin-bottom:6px}
.ht-txt{font-size:11px;color:var(--mu);line-height:1.7;white-space:pre-wrap}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center}
.modal-ov.open{display:flex}
.modal{background:var(--sf);border:1px solid var(--bd2);padding:24px;max-width:520px;width:92%;max-height:80vh;overflow-y:auto}
.modal-ttl{font-size:13px;font-weight:700;color:var(--cy);margin-bottom:6px;letter-spacing:.1em;text-transform:uppercase}
.modal-sub{font-size:11px;color:var(--mu);margin-bottom:16px;line-height:1.6}
.prev-item{background:var(--sf2);border:1px solid var(--bd);padding:7px 10px;margin-bottom:3px;font-size:11px}
.prev-item .pa{color:var(--cy);font-size:10px;margin-top:2px}
.modal-acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.empty{text-align:center;padding:40px 20px;color:var(--di)}
.loader{display:inline-block;width:12px;height:12px;border:2px solid var(--bd2);border-top-color:var(--cy);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:2px;background:var(--sf2);margin-bottom:16px;overflow:hidden}
.prog-f{height:100%;background:var(--cy);width:0%;transition:width .3s}
#st{font-size:11px;color:var(--cy);margin-bottom:6px;min-height:15px}
.mod-hd{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mod-hd-name{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.info-bar{margin-top:16px;padding:10px 12px;background:var(--sf);border:1px solid var(--bd);font-size:10px;color:var(--di)}
.connected-stores{margin-top:4px}
.cs-item{display:inline-flex;align-items:center;gap:6px;background:var(--sf2);border:1px solid var(--bd);padding:3px 10px;margin:2px;cursor:pointer;font-size:10px;color:var(--mu)}
.cs-item:hover{border-color:var(--cy);color:var(--tx)}
.cs-item .cs-dot{width:6px;height:6px;background:var(--cy);border-radius:50%;flex-shrink:0}
</style></head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-row1">
      <div class="logo">UNRLVL ShopifyAuditor</div>
      <div class="store-status" id="store-status">No store loaded</div>
      <span id="score-disp" style="display:none" class="score-badge">—</span>
      <button class="btn btn-p" id="run-btn" onclick="runAudit()" disabled style="margin-left:auto">▶ Run Audit</button>
    </div>
    <div class="topbar-row2">
      <span class="domain-label">Store:</span>
      <input class="domain-input" id="domain-input" type="text" placeholder="yourstore.myshopify.com" autocomplete="off" spellcheck="false" oninput="onDomainInput()" onkeydown="if(event.key==='Enter')lookupStore()">
      <button class="btn btn-g" id="lookup-btn" onclick="lookupStore()">Connect</button>
      <span id="conn-status"></span>
    </div>
    <div class="connected-stores" id="connected-list" style="display:none">
      <span style="font-size:9px;color:var(--di);letter-spacing:.15em;text-transform:uppercase;margin-right:6px">Connected:</span>
    </div>
  </div>
  <div class="main">
    <div class="sidebar"><div class="sid-hd">Modules</div><div id="mod-list"></div></div>
    <div class="content" id="content">
      <div class="empty">
        <div style="font-size:13px;margin-bottom:8px;color:var(--mu)">ShopifyAuditor v2.1</div>
        <div style="font-size:11px;color:var(--di);margin-bottom:12px">Enter any connected Shopify store domain above</div>
        <div style="font-size:10px;color:var(--di)">13 modules · Theme analysis · SEO scoring · Fix engine · Multibrand</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-ov" id="fix-modal">
  <div class="modal">
    <div class="modal-ttl" id="m-ttl">Apply Fix</div>
    <div class="modal-sub" id="m-sub"></div>
    <div id="m-prev"></div>
    <div class="modal-acts">
      <button class="btn btn-g" onclick="closeModal()">Cancel</button>
      <button class="btn btn-p" id="m-confirm" onclick="confirmFix()">Apply Fix</button>
    </div>
  </div>
</div>

<script>
var AUDIT_EF  = 'https://amlvyycfepwhiindxgzw.supabase.co/functions/v1/shopify-audit';
var FIX_EF    = 'https://amlvyycfepwhiindxgzw.supabase.co/functions/v1/shopify-fix';
var LOOKUP_EF = 'https://amlvyycfepwhiindxgzw.supabase.co/functions/v1/shopify-store-lookup';
var MM = {catalog:20,collections:10,seo:10,theme:15,payments:10,orders:10,shipping:5,discounts:5,navigation:10,apps:10,performance:5,b2c_vs_b2b:5};
var auditData=null, activeModule='overview', pendingFix=null, fixStatuses={};
var currentDomain='', currentBrand='', currentType='';
var lookupTimer=null;

// Load connected stores on startup
window.addEventListener('load', function() { loadConnectedStores(); });

async function loadConnectedStores() {
  try {
    var r = await fetch(LOOKUP_EF+'?domain=list');
    var d = await r.json();
    var list = document.getElementById('connected-list');
    if(d.stores && d.stores.length) {
      list.style.display = 'block';
      d.stores.forEach(function(s) {
        var btn = document.createElement('span');
        btn.className = 'cs-item';
        btn.innerHTML = '<span class="cs-dot"></span>' + (s.display_name||s.shop_domain) + ' <span style="color:var(--di);font-size:9px">' + (s.store_type||'').toUpperCase() + '</span>';
        btn.onclick = function() { loadStore(s.shop_domain, s.brand_id, s.store_type, s.display_name||s.shop_domain); };
        list.appendChild(btn);
      });
    }
  } catch(e) { /* silent */ }
}

function onDomainInput() {
  clearTimeout(lookupTimer);
  var val = document.getElementById('domain-input').value.trim();
  document.getElementById('conn-status').innerHTML = '';
  document.getElementById('run-btn').disabled = true;
  if(val.length > 5) { lookupTimer = setTimeout(lookupStore, 800); }
}

async function lookupStore() {
  var raw = document.getElementById('domain-input').value.trim();
  if(!raw) return;
  var domain = raw.toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*/,'');
  // If doesn't have .myshopify.com, try adding it
  if(!domain.includes('.')) domain = domain + '.myshopify.com';
  var statusEl = document.getElementById('conn-status');
  statusEl.innerHTML = '<span style="font-size:10px;color:var(--mu)"><span class="loader"></span>Checking...</span>';
  try {
    var r = await fetch(LOOKUP_EF + '?domain=' + encodeURIComponent(domain));
    var d = await r.json();
    if(d.found) {
      loadStore(d.domain, d.brand_id, d.store_type, d.display_name||d.domain);
    } else {
      statusEl.innerHTML = '<span class="conn-error">Not connected \u2014 OAuth required first</span>';
      document.getElementById('run-btn').disabled = true;
    }
  } catch(e) {
    statusEl.innerHTML = '<span class="conn-error">Lookup error: ' + e.message + '</span>';
  }
}

function loadStore(domain, brand, type, displayName) {
  currentDomain = domain; currentBrand = brand; currentType = type;
  document.getElementById('domain-input').value = domain;
  document.getElementById('store-status').textContent = displayName + ' \u00b7 ' + type.toUpperCase();
  document.getElementById('conn-status').innerHTML = '<span class="conn-ok">\u2713 Connected</span>';
  document.getElementById('run-btn').disabled = false;
  auditData=null; fixStatuses={};
  document.getElementById('content').innerHTML = '<div class="empty"><div style="font-size:11px;color:var(--di)">' + displayName + ' ready \u2014 click Run Audit</div></div>';
  document.getElementById('mod-list').innerHTML = '';
  document.getElementById('score-disp').style.display = 'none';
}

function scCol(v, max) { var p=Math.round(v/max*100); return p>=80?'#00FFD1':p>=50?'#FFB020':'#FF4444'; }

var STEPS=['Connecting to store...','Loading products (up to 250)...','Analyzing descriptions & SEO quality...','Auditing theme files (layout, footer, assets)...','Checking payments & orders...','Reviewing shipping & discounts...','Scanning navigation & pages...','Compiling 13 modules...'];

async function runAudit() {
  if(!currentBrand) return;
  var btn=document.getElementById('run-btn'); btn.disabled=true; btn.innerHTML='<span class="loader"></span>Running...';
  document.getElementById('content').innerHTML='<div style="padding:20px"><div id="st">Initializing...</div><div class="prog"><div class="prog-f" id="pf"></div></div></div>';
  var si=0; var iv=setInterval(function(){if(si<STEPS.length){var e=document.getElementById('st');if(e)e.textContent=STEPS[si++];var p=document.getElementById('pf');if(p)p.style.width=(si/STEPS.length*100)+'%';}},3500);
  try {
    var r=await fetch(AUDIT_EF,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand_id:currentBrand,store_type:currentType,shop_domain:currentDomain})});
    clearInterval(iv);
    if(!r.ok){var t=await r.text();document.getElementById('content').innerHTML='<div style="padding:20px;color:#FF4444">Error '+r.status+': '+t.slice(0,300)+'</div>';btn.disabled=false;btn.textContent='\u25b6 Retry';return;}
    auditData=await r.json();
    if(auditData.error){document.getElementById('content').innerHTML='<div style="padding:20px;color:#FF4444">Error: '+auditData.error+(auditData.detail?' \u2014 '+auditData.detail:'')+'</div>';btn.disabled=false;btn.textContent='\u25b6 Retry';return;}
    fixStatuses={}; activeModule='overview'; renderAudit();
  } catch(e){clearInterval(iv);document.getElementById('content').innerHTML='<div style="padding:20px;color:#FF4444">Network error: '+e.message+'</div>';}
  btn.disabled=false; btn.textContent='\u21ba Re-run';
}

function renderAudit(){
  if(!auditData)return; var d=auditData; var s=d.score||0;
  var cl=s>=80?'sc-g':s>=55?'sc-a':'sc-r';
  var el=document.getElementById('score-disp'); el.textContent=s+'/100'; el.className='score-badge '+cl; el.style.display='';
  renderSidebar(); renderOverview();
}

function renderSidebar(){
  var d=auditData; var sc=d.score_breakdown||{}; var byMod={};
  (d.findings||[]).forEach(function(f){if(!byMod[f.module])byMod[f.module]=[];byMod[f.module].push(f);});
  var html='<div class="mod-row '+(activeModule==='overview'?'act':'')+'" onclick="showMod(\'overview\')"><span class="mod-nm">Overview</span><span class="score-badge '+(d.score>=80?'sc-g':d.score>=55?'sc-a':'sc-r')+'" style="font-size:11px;padding:1px 7px">'+d.score+'</span></div>';
  Object.keys(sc).forEach(function(m){
    var s=sc[m],max=MM[m]||10,mf=byMod[m]||[];
    var crits=mf.filter(function(f){return f.severity==='critical';}).length;
    var imps=mf.filter(function(f){return f.severity==='important';}).length;
    var fixes=mf.filter(function(f){return f.claude_can_fix;}).length;
    var badge=crits?'<span class="badge bd-c">'+crits+'C</span>':imps?'<span class="badge bd-i">'+imps+'I</span>':fixes?'<span class="badge bd-f">FIX</span>':'';
    html+='<div class="mod-row '+(activeModule===m?'act':'')+'" onclick="showMod(\''+m+'\')"><span class="mod-nm">'+m.replace(/_/g,' ')+'</span>'+badge+'<span class="mod-sc" style="color:'+scCol(s,max)+'">'+s+'/'+max+'</span></div>';
  });
  document.getElementById('mod-list').innerHTML=html;
}

function showMod(mod){activeModule=mod;renderSidebar();if(mod==='overview')renderOverview();else renderModule(mod);}

function renderOverview(){
  var d=auditData,fc=d.findings_count||{},sc=d.score_breakdown||{};
  var sCol=d.score>=80?'#00FFD1':d.score>=55?'#FFB020':'#FF4444';
  var html='<div class="ov-grid"><div class="score-box"><div class="score-num" style="color:'+sCol+'">'+d.score+'</div><div class="score-lbl">/100 \u00b7 '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</div></div><div class="cnt-grid"><div class="cnt cr"><div class="cnt-n">'+(fc.critical||0)+'</div><div class="cnt-l">\ud83d\udd34 Critical</div></div><div class="cnt im"><div class="cnt-n">'+(fc.important||0)+'</div><div class="cnt-l">\ud83d\udfe1 Important</div></div><div class="cnt op"><div class="cnt-n">'+(fc.opportunity||0)+'</div><div class="cnt-l">\ud83d\udd35 Opportunity</div></div><div class="cnt fx"><div class="cnt-n">'+(fc.fixable||0)+'</div><div class="cnt-l">\u26a1 Fixable</div></div></div></div>';
  html+='<div class="mod-grid">';
  Object.keys(sc).forEach(function(m){var s=sc[m],max=MM[m]||10;html+='<div class="mod-tile" onclick="showMod(\''+m+'\')"><span class="tile-nm">'+m.replace(/_/g,' ')+'</span><span class="tile-sc" style="color:'+scCol(s,max)+'">'+s+'/'+max+'</span></div>';});
  html+='</div>';
  var crit=(d.findings||[]).filter(function(f){return f.severity==='critical';}),imps=(d.findings||[]).filter(function(f){return f.severity==='important';});
  if(crit.length){html+='<div class="sec-hd"><span class="sec-ttl">\ud83d\udd34 Critical \u2014 '+crit.length+' blocking issues</span></div>';crit.forEach(function(f){html+=renderFinding(f);});}
  if(imps.length){html+='<div class="sec-hd" style="margin-top:16px"><span class="sec-ttl">\ud83d\udfe1 Important \u2014 '+imps.length+' conversion issues</span></div>';imps.forEach(function(f){html+=renderFinding(f);});}
  html+='<div class="info-bar">Audit v2.1 \u00b7 '+d.products_analyzed+' products \u00b7 Theme: '+(d.theme?d.theme.name||'\u2014':'\u2014')+' \u00b7 '+d.domain+(d.has_more_products?' \u00b7 <span style="color:#FFB020">\u26a0 >250 products: partial audit</span>':'')+'</div>';
  document.getElementById('content').innerHTML=html;
}

function renderModule(mod){
  var d=auditData,findings=(d.findings||[]).filter(function(f){return f.module===mod;}),sc=(d.score_breakdown||{})[mod]||0,max=MM[mod]||10;
  var html='<div class="mod-hd"><span class="mod-hd-name">'+mod.replace(/_/g,' ')+'</span><span style="font-size:18px;font-weight:700;color:'+scCol(sc,max)+'">'+sc+'/'+max+'</span></div>';
  if(!findings.length){html+='<div class="empty"><div style="font-size:11px">No findings</div></div>';}
  else{['critical','important','opportunity','ok'].forEach(function(sev){var items=findings.filter(function(f){return f.severity===sev;});if(!items.length)return;var icons={critical:'\ud83d\udd34',important:'\ud83d\udfe1',opportunity:'\ud83d\udd35',ok:'\u2705'};html+='<div class="sec-hd"><span class="sec-ttl">'+icons[sev]+' '+sev.charAt(0).toUpperCase()+sev.slice(1)+' ('+items.length+')</span></div>';items.forEach(function(f){html+=renderFinding(f);});});}
  document.getElementById('content').innerHTML=html;
}

function renderFinding(f){
  var st=fixStatuses[f.id];
  var statusHtml=st?'<span class="fstatus '+st.type+'">'+st.msg+'</span>':'';
  var fixBtn=(f.claude_can_fix&&(!st||st.type!=='done'))?'<button class="btn-fix" onclick="openFixModal(\''+f.id+'\')">&#9889; Apply Fix</button>':'';
  var htBtn=f.how_to_fix?'<button class="btn-ht" onclick="toggleHT(\'ht-'+f.id+'\')">&#128203; How to Fix</button>':'';
  var resHtml='';
  if(f.affected_resources&&f.affected_resources.length){resHtml='<div class="res-hd">Affected ('+f.affected_count+' total, showing '+Math.min(f.affected_resources.length,20)+'):</div><div class="res-list">';f.affected_resources.slice(0,20).forEach(function(r){resHtml+='<div class="chip">'+escH(String(r.title||r.name||r.handle||'').slice(0,45))+(r.current?'<span class="cv">'+escH(String(r.current).slice(0,30))+'</span>':'')+'</div>';});resHtml+='</div>';}
  var htHtml=f.how_to_fix?'<div class="ht-box" id="ht-'+f.id+'"><div class="ht-ttl">How to fix manually</div><div class="ht-txt">'+escH(f.how_to_fix)+'</div></div>':'';
  var fixableBadge=f.claude_can_fix?'<span class="badge bd-f" style="flex-shrink:0">&#9889; fixable</span>':'';
  var sc2=f.severity==='critical'?'cr':f.severity==='important'?'im':f.severity==='opportunity'?'op':'ok';
  return '<div class="fc '+sc2+'" id="fc-'+f.id+'"><div class="fh" onclick="toggleF(\'fb-'+f.id+'\',\'ft-'+f.id+'\')"><span class="sev '+sc2+'">'+f.severity+'</span><span class="fcode">['+escH(f.code||'')+']</span><span class="ftitle">'+escH(f.finding)+'</span>'+(f.affected_count>0?'<span class="fcnt">'+f.affected_count+'</span>':'')+fixableBadge+'<span class="ftog" id="ft-'+f.id+'">&#9658;</span></div><div class="fb" id="fb-'+f.id+'"><div class="fdetail">'+escH(f.detail||'')+'</div>'+resHtml+'<div class="factions">'+fixBtn+htBtn+statusHtml+'</div>'+htHtml+'</div></div>';
}

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toggleF(bid,tid){var b=document.getElementById(bid),t=document.getElementById(tid);if(!b)return;var o=b.classList.toggle('open');if(t)t.classList.toggle('open',o);}
function toggleHT(id){var el=document.getElementById(id);if(el)el.classList.toggle('open');}

function openFixModal(fid){
  var f=(auditData.findings||[]).find(function(x){return x.id===fid;});if(!f)return;pendingFix=f;
  document.getElementById('m-ttl').textContent='Apply Fix: ['+f.code+']';
  document.getElementById('m-sub').textContent=f.finding;
  var items=(f.fix_payload&&f.fix_payload.items)?f.fix_payload.items:((f.fix_payload&&f.fix_payload.products)?f.fix_payload.products:[]);
  var prev='<div class="res-hd">What will be changed ('+items.length+' items):</div>';
  items.slice(0,8).forEach(function(i){prev+='<div class="prev-item">'+escH(i.productTitle||i.title||i.name||'')+'<div class="pa">\u2192 '+(f.fix_type==='inventory_tracking_on'?'Enable inventory tracking':f.fix_type==='seo_title_from_product'?'Set SEO title from product title':f.fix_type)+'</div></div>';});
  if(items.length>8)prev+='<div style="font-size:10px;color:var(--di);padding:5px 0">...and '+(items.length-8)+' more</div>';
  document.getElementById('m-prev').innerHTML=prev;
  document.getElementById('fix-modal').classList.add('open');
}
function closeModal(){document.getElementById('fix-modal').classList.remove('open');pendingFix=null;}

async function confirmFix(){
  if(!pendingFix)return; var f=pendingFix;
  var btn=document.getElementById('m-confirm'); btn.disabled=true; btn.innerHTML='<span class="loader"></span>Applying...';
  closeModal(); fixStatuses[f.id]={type:'applying',msg:'\u23f3 Applying...'}; refreshCard(f.id);
  try{
    var r=await fetch(FIX_EF,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand_id:currentBrand,store_type:currentType,shop_domain:currentDomain,fix_type:f.fix_type,fix_payload:f.fix_payload,preview:false})});
    var result=await r.json();
    if(result.error)fixStatuses[f.id]={type:'error',msg:'\u274c '+result.error};
    else fixStatuses[f.id]={type:'done',msg:'\u2705 Done: '+(result.applied||0)+' fixed'+(result.errors?', '+result.errors+' errors':'')};
  }catch(e){fixStatuses[f.id]={type:'error',msg:'\u274c '+e.message};}
  btn.disabled=false; btn.textContent='Apply Fix'; refreshCard(f.id);
}

function refreshCard(id){
  var f=(auditData.findings||[]).find(function(x){return x.id===id;});if(!f)return;
  var card=document.getElementById('fc-'+id);if(!card)return;
  var wasOpen=(document.getElementById('fb-'+id)||{}).classList&&document.getElementById('fb-'+id).classList.contains('open');
  card.outerHTML=renderFinding(f);
  if(wasOpen){var nb=document.getElementById('fb-'+id),nt=document.getElementById('ft-'+id);if(nb)nb.classList.add('open');if(nt)nt.classList.add('open');}
}
</script>
</body></html>
