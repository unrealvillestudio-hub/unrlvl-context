<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNRLVL ShopifyAuditor v2</title>
<style>
  
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0A0A0A;--surface:#141414;--surface2:#1E1E1E;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);--text:#F2F0EC;--muted:rgba(242,240,236,.45);--dim:rgba(242,240,236,.22);--cyan:#00FFD1;--red:#FF4444;--amber:#FFB020;--blue:#4499FF;--green:#00FFD1;--font:'Courier New',monospace}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:13px}
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100}
.logo{color:var(--cyan);font-size:14px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.store-badge{background:var(--surface2);border:1px solid var(--border2);padding:4px 12px;font-size:11px;color:var(--muted);letter-spacing:.1em}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.score-badge{font-size:20px;font-weight:700;padding:2px 12px;border:1px solid;border-radius:2px}
.score-green{color:var(--cyan);border-color:rgba(0,255,209,.3);background:rgba(0,255,209,.06)}
.score-amber{color:var(--amber);border-color:rgba(255,176,32,.3);background:rgba(255,176,32,.06)}
.score-red{color:var(--red);border-color:rgba(255,68,68,.3);background:rgba(255,68,68,.06)}
btn,button{font-family:var(--font);cursor:pointer;border:none;padding:8px 18px;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;transition:opacity .15s}
.btn-primary{background:var(--cyan);color:#080808}
.btn-primary:hover{opacity:.85}
.btn-primary:disabled{background:var(--surface2);color:var(--dim);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.btn-fix{background:rgba(0,255,209,.12);color:var(--cyan);border:1px solid rgba(0,255,209,.3);padding:5px 12px;font-size:10px}
.btn-fix:hover{background:rgba(0,255,209,.2)}
.btn-howto{background:transparent;color:var(--muted);border:1px solid var(--border);padding:5px 12px;font-size:10px}
.btn-howto:hover{color:var(--text);border-color:var(--border2)}
.main{display:grid;grid-template-columns:220px 1fr;overflow:hidden;height:calc(100vh - 56px)}
.sidebar{border-right:1px solid var(--border);overflow-y:auto;padding:16px 0}
.sidebar-section{padding:8px 16px 4px;font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.mod-item{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;border-left:2px solid transparent;transition:background .1s}
.mod-item:hover{background:var(--surface)}
.mod-item.active{background:var(--surface);border-left-color:var(--cyan)}
.mod-name{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);flex:1}
.mod-item.active .mod-name{color:var(--text)}
.mod-score{font-size:11px;font-weight:700}
.mod-badge{font-size:9px;padding:1px 5px;border-radius:2px;font-weight:700}
.badge-critical{background:rgba(255,68,68,.15);color:var(--red)}
.badge-important{background:rgba(255,176,32,.1);color:var(--amber)}
.badge-opportunity{background:rgba(68,153,255,.1);color:var(--blue)}
.badge-ok{background:rgba(0,255,209,.08);color:var(--cyan)}
.badge-fixable{background:rgba(0,255,209,.15);color:var(--cyan);border:1px solid rgba(0,255,209,.3)}
.content{overflow-y:auto;padding:24px}
.overview{display:grid;grid-template-columns:auto 1fr;gap:20px;margin-bottom:28px;align-items:start}
.score-main{background:var(--surface);border:1px solid rgba(0,255,209,.25);padding:20px 28px;text-align:center}
.score-num{font-size:64px;font-weight:900;line-height:1}
.score-label{font-size:9px;letter-spacing:.25em;color:var(--muted);margin-top:4px;text-transform:uppercase}
.counts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.count-card{background:var(--surface);border:1px solid var(--border);padding:12px 16px;text-align:center}
.count-card.critical{border-color:rgba(255,68,68,.2);background:rgba(255,68,68,.04)}
.count-card.important{border-color:rgba(255,176,32,.15);background:rgba(255,176,32,.03)}
.count-card.opportunity{border-color:rgba(68,153,255,.15);background:rgba(68,153,255,.03)}
.count-card.fixable{border-color:rgba(0,255,209,.2);background:rgba(0,255,209,.04)}
.count-num{font-size:28px;font-weight:700;line-height:1;margin-bottom:3px}
.count-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.count-card.critical .count-num,.count-card.critical .count-label{color:var(--red)}
.count-card.important .count-num,.count-card.important .count-label{color:var(--amber)}
.count-card.opportunity .count-num,.count-card.opportunity .count-label{color:var(--blue)}
.count-card.fixable .count-num,.count-card.fixable .count-label{color:var(--cyan)}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px;margin-bottom:24px}
.mod-tile{background:var(--surface);border:1px solid var(--border);padding:8px 10px;cursor:pointer;transition:border-color .15s;display:flex;justify-content:space-between;align-items:center}
.mod-tile:hover{border-color:var(--border2)}
.mod-tile-name{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mod-tile-score{font-size:12px;font-weight:700}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.finding-card{background:var(--surface);border:1px solid var(--border);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.finding-card:hover{border-color:var(--border2)}
.finding-card.critical{border-left:3px solid var(--red)}
.finding-card.important{border-left:3px solid var(--amber)}
.finding-card.opportunity{border-left:3px solid var(--blue)}
.finding-card.ok{border-left:3px solid rgba(0,255,209,.3);opacity:.65}
.finding-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.finding-header:hover .finding-toggle{color:var(--text)}
.sev-pill{font-size:8px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:2px;white-space:nowrap;flex-shrink:0}
.sev-pill.critical{background:rgba(255,68,68,.15);color:var(--red)}
.sev-pill.important{background:rgba(255,176,32,.1);color:var(--amber)}
.sev-pill.opportunity{background:rgba(68,153,255,.1);color:var(--blue)}
.sev-pill.ok{background:rgba(0,255,209,.06);color:rgba(0,255,209,.6)}
.finding-code{font-size:10px;color:var(--dim);white-space:nowrap;flex-shrink:0}
.finding-title{font-size:12px;font-weight:700;flex:1}
.finding-count{font-size:10px;color:var(--dim);white-space:nowrap}
.finding-toggle{color:var(--dim);font-size:14px;flex-shrink:0;transition:transform .2s}
.finding-toggle.open{transform:rotate(90deg)}
.finding-body{border-top:1px solid var(--border);padding:14px 16px;display:none}
.finding-body.open{display:block}
.finding-detail{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.resources-title{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.resources-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;max-height:120px;overflow-y:auto}
.resource-chip{background:var(--surface2);border:1px solid var(--border);padding:2px 8px;font-size:10px;color:var(--muted)}
.resource-chip .chip-val{color:var(--dim);font-size:9px;margin-left:4px}
.finding-actions{display:flex;gap:8px;align-items:center}
.fix-status{font-size:10px;padding:4px 10px;border-radius:2px}
.fix-status.applying{background:rgba(255,176,32,.1);color:var(--amber)}
.fix-status.done{background:rgba(0,255,209,.1);color:var(--cyan)}
.fix-status.error{background:rgba(255,68,68,.1);color:var(--red)}
.howto-box{background:var(--surface2);border:1px solid var(--border);padding:12px 14px;margin-top:10px;display:none}
.howto-box.open{display:block}
.howto-title{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
.howto-text{font-size:11px;color:var(--muted);line-height:1.7;white-space:pre-wrap}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);padding:28px;max-width:580px;width:90%;max-height:80vh;overflow-y:auto}
.modal-title{font-size:14px;font-weight:700;color:var(--cyan);margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase}
.modal-subtitle{font-size:11px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.preview-item{background:var(--surface2);border:1px solid var(--border);padding:8px 12px;margin-bottom:4px;font-size:11px}
.preview-item .item-action{color:var(--cyan);font-size:10px;margin-top:2px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.empty-state{text-align:center;padding:48px 24px;color:var(--dim)}
.empty-title{font-size:13px;margin-bottom:8px}
.empty-sub{font-size:11px}
.run-section{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding:16px;background:var(--surface);border:1px solid var(--border)}
.run-info{flex:1}
.run-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.run-value{font-size:11px;color:var(--muted)}
.loader{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{background:var(--surface);border:1px solid var(--border);padding:4px 12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--muted);transition:all .15s;font-family:var(--font)}
.filter-btn.active{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.progress-bar{height:3px;background:var(--surface2);margin-bottom:20px;overflow:hidden;border-radius:0}
.progress-fill{height:100%;background:var(--cyan);width:0%;transition:width .3s}
#status-text{font-size:11px;color:var(--cyan);margin-bottom:8px;min-height:16px}
</style></head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">UNRLVL ShopifyAuditor</div>
    <div class="store-badge" id="store-label">No store loaded</div>
    <div class="topbar-right">
      <div id="score-display" style="display:none" class="score-badge">—</div>
      <button class="btn-primary" id="run-btn" onclick="runAudit()">▶ Run Audit</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section">Modules</div>
      <div id="module-list"></div>
    </div>
    <div class="content" id="content">
      <div id="main-panel"><div class="empty-state"><div class="empty-title">ShopifyAuditor v2.0</div><div class="empty-sub">Deep audit · 13 modules · Theme analysis · SEO quality · Fix engine</div><br><button class="btn-primary" onclick="runAudit()">▶ Run First Audit</button></div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="fix-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Apply Fix</div>
    <div class="modal-subtitle" id="modal-subtitle"></div>
    <div id="modal-preview"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" id="modal-confirm" onclick="confirmFix()">Apply Fix</button>
    </div>
  </div>
</div>

<script>
const AUDIT_EF = 'https://amlvyycfepwhiindxgzw.supabase.co/functions/v1/shopify-audit';
const FIX_EF   = 'https://amlvyycfepwhiindxgzw.supabase.co/functions/v1/shopify-fix';
const BRAND = 'NeuroneSCF', TYPE = 'b2b';

const MM = {catalog:20,collections:10,seo:10,theme:15,payments:10,orders:10,shipping:5,discounts:5,navigation:10,apps:10,performance:5,b2c_vs_b2b:5};
let auditData = null, activeModule = 'overview', pendingFix = null, fixStatuses = {};

const steps = ['Connecting to store...','Loading 250+ products...','Analyzing descriptions & SEO quality...','Auditing theme files (layout, footer, assets)...','Checking payments & orders...','Reviewing shipping zones...','Scanning discounts...','Auditing navigation & pages...','Compiling 13 modules...'];

async function runAudit() {
  const btn = document.getElementById('run-btn');
  const content = document.getElementById('content');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span>Running...';

  content.innerHTML = '<div style="padding:24px"><div id="status-text">Initializing...</div><div class="progress-bar"><div class="progress-fill" id="progress"></div></div></div>';

  let si = 0;
  const iv = setInterval(() => {
    if (si < steps.length) {
      document.getElementById('status-text').textContent = steps[si++];
      document.getElementById('progress').style.width = (si/steps.length*100)+'%';
    }
  }, 3200);

  try {
    const r = await fetch(AUDIT_EF, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({brand_id:BRAND, store_type:TYPE})});
    clearInterval(iv);
    if (!r.ok) {
      const t = await r.text();
      content.innerHTML = `<div style="padding:24px;color:var(--red)">Error ${r.status}: ${t.slice(0,200)}</div>`;
      btn.disabled=false; btn.textContent='▶ Retry';
      return;
    }
    auditData = await r.json();
    if (auditData.error) {
      content.innerHTML = `<div style="padding:24px;color:var(--red)">Error: ${auditData.error} — ${auditData.detail||''}</div>`;
      btn.disabled=false; btn.textContent='▶ Retry';
      return;
    }
    fixStatuses = {};
    renderAudit();
    btn.disabled=false;
    btn.textContent='↺ Re-run';
  } catch(e) {
    clearInterval(iv);
    content.innerHTML = `<div style="padding:24px;color:var(--red)">Network error: ${e.message}</div>`;
    btn.disabled=false; btn.textContent='▶ Retry';
  }
}

function renderAudit() {
  if (!auditData) return;
  const d = auditData;
  const s = d.score || 0;
  const sc = s >= 80 ? 'score-green' : s >= 55 ? 'score-amber' : 'score-red';
  const el = document.getElementById('score-display');
  el.textContent = s + '/100';
  el.className = 'score-badge ' + sc;
  el.style.display = '';
  document.getElementById('store-label').textContent = (d.shop||d.domain||'') + ' · ' + (d.store_type||'').toUpperCase();

  renderSidebar();
  if (activeModule === 'overview') renderOverview();
  else renderModule(activeModule);
}

function scColor(v, max) {
  const p = Math.round(v/max*100);
  return p>=80?'var(--cyan)':p>=50?'var(--amber)':'var(--red)';
}

function renderSidebar() {
  const d = auditData; const sc = d.score_breakdown||{};
  const byMod = {};
  (d.findings||[]).forEach(f => { if(!byMod[f.module]) byMod[f.module]=[]; byMod[f.module].push(f); });

  let html = `<div class="mod-item ${activeModule==='overview'?'active':''}" onclick="showModule('overview')">
    <span class="mod-name">Overview</span><span class="score-badge ${d.score>=80?'score-green':d.score>=55?'score-amber':'score-red'}" style="font-size:12px;padding:1px 8px">${d.score}</span>
  </div>`;
  Object.entries(sc).forEach(([m, s]) => {
    const max = MM[m]||10;
    const mFindings = byMod[m]||[];
    const crits = mFindings.filter(f=>f.severity==='critical').length;
    const imps  = mFindings.filter(f=>f.severity==='important').length;
    const fixes = mFindings.filter(f=>f.claude_can_fix).length;
    let badge = '';
    if(crits) badge = `<span class="mod-badge badge-critical">${crits}C</span>`;
    else if(imps) badge = `<span class="mod-badge badge-important">${imps}I</span>`;
    else if(fixes) badge = `<span class="mod-badge badge-fixable">FIX</span>`;
    html += `<div class="mod-item ${activeModule===m?'active':''}" onclick="showModule('${m}')">
      <span class="mod-name">${m.replace(/_/g,' ')}</span>
      ${badge}
      <span class="mod-tile-score" style="color:${scColor(s,max)}">${s}/${max}</span>
    </div>`;
  });
  document.getElementById('module-list').innerHTML = html;
}

function showModule(mod) {
  activeModule = mod;
  renderSidebar();
  if (mod === 'overview') renderOverview();
  else renderModule(mod);
}

function renderOverview() {
  const d = auditData; const fc = d.findings_count||{}; const sc = d.score_breakdown||{};
  let html = `<div class="overview">
    <div class="score-main"><div class="score-num" style="color:${d.score>=80?'var(--cyan)':d.score>=55?'var(--amber)':'var(--red)'}">${d.score}</div><div class="score-label">/100 · ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div></div>
    <div class="counts-grid">
      <div class="count-card critical"><div class="count-num">${fc.critical||0}</div><div class="count-label">🔴 Critical</div></div>
      <div class="count-card important"><div class="count-num">${fc.important||0}</div><div class="count-label">🟡 Important</div></div>
      <div class="count-card opportunity"><div class="count-num">${fc.opportunity||0}</div><div class="count-label">🔵 Opportunity</div></div>
      <div class="count-card fixable"><div class="count-num">${fc.fixable||0}</div><div class="count-label">⚡ Fixable by Claude</div></div>
    </div>
  </div>`;

  html += '<div class="module-grid">';
  Object.entries(sc).forEach(([m,s]) => {
    const max = MM[m]||10;
    html += `<div class="mod-tile" onclick="showModule('${m}')"><span class="mod-tile-name">${m.replace(/_/g,' ')}</span><span class="mod-tile-score" style="color:${scColor(s,max)}">${s}/${max}</span></div>`;
  });
  html += '</div>';

  html += '<div class="section-header"><span class="section-title">All Critical & Important Findings</span></div>';
  const crit = (d.findings||[]).filter(f=>f.severity==='critical');
  const imps = (d.findings||[]).filter(f=>f.severity==='important');
  crit.forEach(f => { html += renderFinding(f); });
  imps.forEach(f => { html += renderFinding(f); });

  html += `<div style="margin-top:20px;padding:12px;background:var(--surface);border:1px solid var(--border);font-size:10px;color:var(--dim)">
    Audit v2.0 · ${d.products_analyzed||0} products analyzed · Theme: ${d.theme?.name||'—'} · Saved to Supabase
    ${d.has_more_products?'<span style="color:var(--amber);margin-left:8px">⚠ >250 products: audit is partial (first page only)</span>':''}
  </div>`;

  document.getElementById('content').innerHTML = html;
}

function renderModule(mod) {
  const d = auditData;
  const findings = (d.findings||[]).filter(f=>f.module===mod);
  const sc = (d.score_breakdown||{})[mod]||0;
  const max = MM[mod]||10;

  let html = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <span style="font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase">${mod.replace(/_/g,' ')}</span>
    <span style="font-size:20px;font-weight:700;color:${scColor(sc,max)}">${sc}/${max}</span>
  </div>`;

  if(!findings.length) { html += '<div class="empty-state"><div class="empty-title">No findings for this module</div></div>'; }
  else {
    ['critical','important','opportunity','ok'].forEach(sev => {
      const items = findings.filter(f=>f.severity===sev);
      if(!items.length) return;
      const colors = {critical:var(--red),important:var(--amber),opportunity:var(--blue),ok:'rgba(0,255,209,.5)'};
      const labels = {critical:'🔴 Critical',important:'🟡 Important',opportunity:'🔵 Opportunities',ok:'✅ Passing'};
      html += `<div class="section-header" style="margin-top:${sev!=='critical'?'20px':'0'}"><span class="section-title">${labels[sev]} (${items.length})</span></div>`;
      items.forEach(f => { html += renderFinding(f); });
    });
  }
  document.getElementById('content').innerHTML = html;
}

function renderFinding(f) {
  const st = fixStatuses[f.id];
  const statusHtml = st ? `<span class="fix-status ${st.type}">${st.msg}</span>` : '';

  let actionsHtml = '';
  if (f.claude_can_fix && !st?.type?.includes('done')) {
    actionsHtml += `<button class="btn-fix" onclick="openFixModal('${f.id}')">⚡ Apply Fix</button>`;
  }
  if (f.how_to_fix) {
    actionsHtml += `<button class="btn-howto" onclick="toggleHowTo('howto-${f.id}')">📋 How to Fix</button>`;
  }

  const resourcesHtml = f.affected_resources?.length ? `
    <div class="resources-title">Affected (${f.affected_count} total, showing ${Math.min(f.affected_resources.length,20)}):</div>
    <div class="resources-list">${f.affected_resources.slice(0,20).map(r=>`<div class="resource-chip">${(r.title||r.name||r.handle||'').slice(0,40)}${r.current?`<span class="chip-val">${String(r.current).slice(0,30)}</span>`:''}</div>`).join('')}</div>
  ` : '';

  const howtoHtml = f.how_to_fix ? `
    <div class="howto-box" id="howto-${f.id}">
      <div class="howto-title">How to fix manually</div>
      <div class="howto-text">${f.how_to_fix}</div>
    </div>` : '';

  return `<div class="finding-card ${f.severity}" id="fc-${f.id}">
    <div class="finding-header" onclick="toggleFinding('fb-${f.id}','tog-${f.id}')">
      <span class="sev-pill ${f.severity}">${f.severity}</span>
      <span class="finding-code">[${f.code}]</span>
      <span class="finding-title">${f.finding}</span>
      ${f.affected_count>0?`<span class="finding-count">${f.affected_count} affected</span>`:''}
      ${f.claude_can_fix?'<span class="mod-badge badge-fixable" style="flex-shrink:0">⚡ fixable</span>':''}
      <span class="finding-toggle" id="tog-${f.id}">▶</span>
    </div>
    <div class="finding-body" id="fb-${f.id}">
      <div class="finding-detail">${f.detail||''}</div>
      ${resourcesHtml}
      <div class="finding-actions">${actionsHtml}${statusHtml}</div>
      ${howtoHtml}
    </div>
  </div>`;
}

function toggleFinding(bodyId, togId) {
  const body = document.getElementById(bodyId);
  const tog  = document.getElementById(togId);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (tog) tog.classList.toggle('open', open);
}

function toggleHowTo(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function openFixModal(findingId) {
  const f = (auditData.findings||[]).find(x=>x.id===findingId);
  if (!f) return;
  pendingFix = f;
  document.getElementById('modal-title').textContent = 'Apply Fix: [' + f.code + ']';
  document.getElementById('modal-subtitle').textContent = f.finding;

  // Get preview
  const items = f.fix_payload?.items || f.fix_payload?.products || [];
  let preview = `<div class="resources-title">What Claude will fix (${items.length} items):</div>`;
  preview += items.slice(0,8).map(i=>`<div class="preview-item">${i.productTitle||i.title||i.name}<div class="item-action">→ ${f.fix_type==='inventory_tracking_on'?'Enable inventory tracking':'Set SEO title from product title'}</div></div>`).join('');
  if (items.length>8) preview += `<div style="font-size:10px;color:var(--dim);padding:6px 0">...and ${items.length-8} more</div>`;

  document.getElementById('modal-preview').innerHTML = preview;
  document.getElementById('fix-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('fix-modal').classList.remove('open');
  pendingFix = null;
}

async function confirmFix() {
  if (!pendingFix) return;
  const f = pendingFix;
  const btn = document.getElementById('modal-confirm');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span>Applying...';
  closeModal();

  fixStatuses[f.id] = {type:'applying', msg:'⏳ Applying fix...'};
  refreshFindingCard(f.id);

  try {
    const r = await fetch(FIX_EF, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({brand_id:BRAND, store_type:TYPE, fix_type:f.fix_type, fix_payload:f.fix_payload, preview:false})});
    const result = await r.json();
    if (result.error) {
      fixStatuses[f.id] = {type:'error', msg:'❌ Error: ' + result.error};
    } else {
      fixStatuses[f.id] = {type:'done', msg:`✅ Applied: ${result.applied} fixed, ${result.errors||0} errors`};
    }
  } catch(e) {
    fixStatuses[f.id] = {type:'error', msg:'❌ Network error: ' + e.message};
  }

  btn.disabled = false;
  btn.textContent = 'Apply Fix';
  refreshFindingCard(f.id);
}

function refreshFindingCard(id) {
  const f = (auditData.findings||[]).find(x=>x.id===id);
  if (!f) return;
  const card = document.getElementById('fc-'+id);
  if (!card) return;
  const wasOpen = document.getElementById('fb-'+id)?.classList.contains('open');
  card.outerHTML = renderFinding(f);
  if (wasOpen) {
    const newBody = document.getElementById('fb-'+id);
    const newTog  = document.getElementById('tog-'+id);
    if (newBody) newBody.classList.add('open');
    if (newTog)  newTog.classList.add('open');
  }
}
</script>
</body></html>
